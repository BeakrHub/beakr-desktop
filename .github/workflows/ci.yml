name: CI

# Compile gate for pull requests. release.yml only runs on tags, so before this
# workflow a platform-specific break could not surface until a release was
# already half-published: v0.4.0 shipped macOS-only because the Windows arm of
# process_group.rs had never been compiled (dev is macOS). Checking both
# platforms here catches that in minutes instead of mid-release.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ci-${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      # `generate_context!` embeds frontendDist (../dist) at compile time, so
      # the frontend must be built before cargo can check the crate.
      - name: Build frontend
        run: npm run build

      # --all-targets so test code is type-checked too, not just the lib.
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # A release-profile paired launch has different window/exit behavior from
      # debug builds. Compile it against an unreachable loopback endpoint so the
      # synthetic CI token can never reach or mutate a real Beakr environment.
      - name: Build paired release smoke binary
        if: matrix.os == 'windows-latest'
        env:
          BEAKR_WS_URL: ws://127.0.0.1:9/v1/desktop-agent/ws
        run: cargo build --manifest-path src-tauri/Cargo.toml --release

      - name: Paired release stays alive
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: ./scripts/test-windows-ci-paired-lifetime.ps1
